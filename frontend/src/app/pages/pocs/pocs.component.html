<section class="page-section">
  <div class="container">
    <div class="section-header" style="text-align: left; margin-bottom: 40px; border-left: 4px solid var(--cyan-primary); padding-left: 20px;">
      <h1 class="section-title" style="font-size: 3rem; margin-bottom: 12px;">
        Proof of <span class="gradient-text-cyan">Concepts</span>
      </h1>
      <p class="section-desc" style="margin: 0; max-width: 800px;">
        Experimental prototypes, technical explorations, and innovative ideas brought to life.
      </p>
    </div>

    <div *ngIf="loading" style="display: flex; justify-content: center; padding: 60px 0;">
      <div style="width: 48px; height: 48px; border: 3px solid rgba(0, 240, 255, 0.2); border-top-color: var(--cyan-primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>

    <div *ngIf="!loading && pocs.length === 0" class="glass-panel" style="padding: 60px; text-align: center;">
      <h3 style="font-size: 1.5rem; color: #fff; margin-bottom: 8px;">No POCs Found</h3>
      <p style="color: var(--text-muted);">Check back later for new experiments.</p>
    </div>

    <div *ngIf="!loading && pocs.length > 0" class="projects-grid" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));">
      <div *ngFor="let poc of pocs" class="project-card glass-panel" style="padding: 0; overflow: hidden; display: flex; flex-direction: column;">
        
        <!-- Image Container (Fallback to empty state if no image) -->
        <div style="height: 180px; width: 100%; background: #0f1629; position: relative;">
          <img *ngIf="poc.image_url" [src]="poc.image_url" [alt]="poc.title" style="width: 100%; height: 100%; object-fit: cover;">
          <div *ngIf="!poc.image_url" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.1);">
            <i class="fa-solid fa-file-code" style="font-size: 3rem;"></i>
          </div>
          <div style="position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; color: var(--cyan-primary); border: 1px solid rgba(0, 240, 255, 0.3);">
            {{ poc.date | date:'mediumDate' }}
          </div>
        </div>

        <!-- Content -->
        <div style="padding: 24px; flex-grow: 1; display: flex; flex-direction: column;">
          <h3 style="font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 12px;">{{ poc.title }}</h3>
          <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; flex-grow: 1;">{{ poc.description }}</p>
          
          <!-- Actions -->
          <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border-subtle);">
            <a *ngIf="poc.document_url" [href]="poc.document_url" target="_blank" rel="noopener noreferrer" class="btn btn-primary" style="width: 100%; justify-content: center;">
              <i class="fa-solid fa-file-pdf"></i> View Document
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<style>
@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
